<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYUH Food Fest Leaderboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===========================
         Header
    ============================ -->

    <header class="hero">

        <div class="hero-content">

            <h1>Food Fest Sales</h1>
            <br>

        </div>

    </header>

    <!-- ===========================
         Statistics
    ============================ -->

    <section class="stats-container">

        <div class="stat-card">

            <h2 id="clubsServing">0</h2>

            <p>Clubs Serving</p>

        </div>

        <div class="stat-card">

            <h2 id="totalOrders">0</h2>

            <p>Total Orders</p>

        </div>

        <div class="stat-card">

            <h2 id="totalClubs">0</h2>

            <p>Total Clubs</p>

        </div>

    </section>

    <!-- ===========================
         Leaderboard
    ============================ -->

    <main class="container">

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Rank</th>

                        <th>Club</th>

                        <th>Category</th>

                        <th>Food</th>

                        <th>Price</th>

                        <th>Status</th>

                        <th>Recognition</th>


                    </tr>

                </thead>

                <tbody id="leaderboardBody">

                </tbody>

            </table>

        </div>

    </main>

    <!-- ===========================
         Footer
    ============================ -->

    <footer>

        <p>
            BYU–Hawaii Food Fest
        </p>

    </footer>

    <script src="app.js"></script>

</body>
</html>
